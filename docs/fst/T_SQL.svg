@startuml T_SQL
hide empty description
left to right direction
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam state {
  BackgroundColor #FFFFFF
  BorderColor #333333
}
title T_SQL: {sql} → SQL

state q0
state q1
state q2
state q3
state qF #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q1 : s / ε
q1 - -> q2 : q / ε
q2 - -> q3 : l / ε
q3 - -> qF : ε / SQL
qF - -> [*]
@enduml

