@startuml T_ETL
hide empty description
left to right direction
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam state {
  BackgroundColor #FFFFFF
  BorderColor #333333
}
title T_ETL: {elt, etl} → ETL

state q0
state q1
state q2
state q3
state q4
state q5
state qF #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q1 : e / ε
q1 - -> q2 : l / ε
q1 - -> q4 : t / ε
q2 - -> q3 : t / ε
q3 - -> qF : ε / ETL
q4 - -> q5 : l / ε
q5 - -> qF : ε / ETL
qF - -> [*]
@enduml

