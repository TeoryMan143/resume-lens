@startuml T_ORACLE
hide empty description
left to right direction
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam state {
  BackgroundColor #FFFFFF
  BorderColor #333333
}
title T_ORACLE: {oracle} → ORACLE

state q0
state q1
state q2
state q3
state q4
state q5
state q6
state qF #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q1 : o / ε
q1 - -> q2 : r / ε
q2 - -> q3 : a / ε
q3 - -> q4 : c / ε
q4 - -> q5 : l / ε
q5 - -> q6 : e / ε
q6 - -> qF : ε / ORACLE
qF - -> [*]
@enduml

