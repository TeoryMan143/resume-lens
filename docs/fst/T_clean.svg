@startuml T_clean
hide empty description
left to right direction
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam state {
  BackgroundColor #FFFFFF
  BorderColor #333333
}
title T_clean: case folding and separator removal

state q0 #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q0 : x / lower(x),  x ∈ {A,…,Z}\nx / x,  x ∈ {a,…,z} ∪ {0,…,9} ∪ {+, #}\nx / ε,  x ∈ {␣, -, ., _, /}
q0 - -> [*]
@enduml

