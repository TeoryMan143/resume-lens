state q0
state q1
state q2
state q3
state q4
state q5
state qF #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q1 : n / ε
q1 - -> q2 : u / ε
q2 - -> q3 : m / ε
q3 - -> q4 : p / ε
q4 - -> q5 : y / ε
q5 - -> qF : ε / NUMPY
qF - -> [*]
@enduml

