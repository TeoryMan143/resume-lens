state q0
state q1
state q2
state q3
state q4
state qF #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q1 : r / ε
q1 - -> q2 : u / ε
q2 - -> q3 : b / ε
q3 - -> q4 : y / ε
q4 - -> qF : ε / RUBY
qF - -> [*]
@enduml

