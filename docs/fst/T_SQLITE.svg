q0 - -> q1 : s / ε
q1 - -> q2 : q / ε
q2 - -> q3 : l / ε
q3 - -> q4 : i / ε
q4 - -> q5 : t / ε
q5 - -> q6 : e / ε
q6 - -> qF : ε / SQLITE
qF - -> [*]
@enduml

