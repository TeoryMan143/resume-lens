@startuml T_ANSIBLE
hide empty description
left to right direction
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam state {
  BackgroundColor #FFFFFF
  BorderColor #333333
}
title T_ANSIBLE: {ansible} → ANSIBLE

state q0
state q1
state q2
state q3
state q4
state q5
state q6
state q7
state qF #E8F5E9 ##[bold]2E7D32

[*] - -> q0
q0 - -> q1 : a / ε
q1 - -> q2 : n / ε
q2 - -> q3 : s / ε
q3 - -> q4 : i / ε
q4 - -> q5 : b / ε
q5 - -> q6 : l / ε
q6 - -> q7 : e / ε
q7 - -> qF : ε / ANSIBLE
qF - -> [*]
@enduml

